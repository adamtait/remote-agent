name: codex
version: "1.0.0"
description: "Installs and configures the OpenAI Codex CLI on the workstation"
config:
  - name: enabled
    type: bool
    description: "Enable Codex CLI?"
    default: false
auth_providers:
  - name: oauth
    description: "ChatGPT OAuth (recommended) — base64 of ~/.codex/auth.json"
    secrets:
      - name: codex_auth_json
        env_var: CODEX_AUTH_JSON_B64
        description: "Run `base64 < ~/.codex/auth.json | tr -d '\\n'` after `codex login` and paste the result"
        default_secret_name: codex-auth-json
  - name: apikey
    description: "OpenAI API key"
    secrets:
      - name: codex_api_key
        env_var: OPENAI_API_KEY
        description: "API key from platform.openai.com"
        default_secret_name: openai-api-key
